name = "cf-edge-router"
main = "worker.js"
compatibility_date = "2025-07-15"

# 走自定义路由 panhub.shenzjd.com/*，关闭公开的 workers.dev 地址与预览地址
workers_dev = false
preview_urls = false

# 健康状态缓存（Cron 探测写入）
[[kv_namespaces]]
binding = "ROUTER_STATE"
id = "70dd36d3bc32412ea5fce82df9f48cab"

# 备用 Worker（fallback 目标）：Service Binding 直调。
# ⚠️ 同 zone Worker 之间禁止用 fetch()（error 1042），必须用 Service Binding。
[[services]]
binding = "FALLBACK"
service = "panhub-shenzjd-com"

# 每 1 分钟探测主源健康（免费计划 Cron 最小间隔 1 分钟）
[triggers]
crons = ["*/1 * * * *"]

# ===== 非敏感配置 =====
# ⚠️ 敏感值（DOCKER_ORIGIN / DOCKER_HOST / FALLBACK_WORKER）用 wrangler secret 加密存储，不写在此文件：
#     npx wrangler secret put DOCKER_ORIGIN
#     npx wrangler secret put DOCKER_HOST
#     npx wrangler secret put FALLBACK_WORKER
[vars]
# 健康检查路径（主源需返回 2xx）
HEALTH_PATH = "/api/health"
# 主源流量权重（0-100）：100=全走主源（纯容灾），90=10% 流量灰度到备用
WEIGHT_DOCKER = "100"
# 健康状态 TTL（秒）与探测超时（毫秒）：TTL 必须大于 Cron 间隔（60s）
HEALTH_TTL_SEC = "120"
HEALTH_TIMEOUT_MS = "5000"
